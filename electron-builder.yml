appId: id.docflow.studio
productName: DocFlow Studio
copyright: Copyright © 2026 DocFlow
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/main.js
asar: true
compression: maximum
artifactName: DocFlowStudio-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: DocFlowStudio-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DocFlow Studio
  include: build/installer.nsh
portable:
  artifactName: DocFlowStudio-${version}-Portable-${arch}.${ext}
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown source document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    description: Markdown source document
    role: Editor
    mimeType: text/markdown
  - ext: txt
    name: Text Document
    description: Plain text document
    role: Editor
    mimeType: text/plain
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  icon: build/icon.png
  mimeTypes:
    - text/markdown
    - text/plain
  desktop:
    entry:
      Name: DocFlow Studio
      Comment: Markdown authoring & publication-grade export
      Categories: Office;TextEditor;
      MimeType: text/markdown;text/plain;
      StartupWMClass: DocFlow Studio
appImage:
  artifactName: DocFlowStudio-${version}-${arch}.${ext}
deb:
  artifactName: DocFlowStudio-${version}-${arch}.${ext}
